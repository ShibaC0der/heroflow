[project]
name = "heroflow"
version = "0.2.0"
description = "Оркестратор агентских флоу: задача из Jira -> спека -> код -> PR"
requires-python = ">=3.13"
dependencies = [
    "jira2markdown>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "questionary>=2.0",
    "qwen-code-sdk>=0.1.0rc0",
    "requests>=2.32",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
heroflow = "heroflow.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
    "types-pyyaml",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
prerelease = "if-necessary-or-explicit"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Русские строки в промптах и логах содержат «похожие» символы, это нормально
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Промпты — длинные строки текста, переносить их ради линтера не нужно
"**/prompts.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["heroflow"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["qwen_code_sdk.*", "jira2markdown.*", "questionary.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
